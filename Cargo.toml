[workspace]
resolver = "2"
members = [
    "crates/gguf",
    "crates/p100",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sivartydrup/trav-p100"
authors = ["trav-p100 contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
half = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"
fancy-regex = "0.14"
libc = "0.2"
rand = "0.8"
rand_chacha = "0.3"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

trav-gguf = { path = "crates/gguf" }
trav-p100 = { path = "crates/p100" }
trav-engine = { path = "crates/engine" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
# The engine is bandwidth-bound; an unoptimised host loop in front of the GPU
# distorts every measurement.
opt-level = 2
